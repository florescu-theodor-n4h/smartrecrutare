name: Livrare continua

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  livreaza:
    name: Publica WAR-ul in GitHub Releases
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Preia versiunea etichetata
        uses: actions/checkout@v4

      - name: Configureaza Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Construieste artefactul de livrare
        run: mvn --batch-mode --update-snapshots -DskipTests package

      - name: Creeaza release-ul si ataseaza WAR-ul
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" target/*.war \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SmartRecrutare ${GITHUB_REF_NAME}" \
            --generate-notes
